<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivan Cortes - Case Study Viewer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Moderustic:wght@400;700&display=swap"
      rel="stylesheet"
    />

  <body class="viewer-body">
    <div id="google_translate_element" style="position: absolute; top: 15px; left: 20px; z-index: 9999;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: true
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        /* Widget Styling */
        .goog-te-gadget-simple {
            background-color: rgba(255,255,255,0.9) !important;
            border: 1px solid #e0e0e0 !important;
            padding: 5px !important;
            border-radius: 4px !important;
            font-family: sans-serif !important;
        }
        .goog-te-gadget-simple a { text-decoration: none !important; color: #333 !important; }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
    <div class="container">
      <h1 class="viewer-title">Case Study Viewer</h1>
      <p>
        The links below point to the case study files in this repository.
      </p>

      <ul>
        <li>
          <a
            class="project-link"
            href="MovieMobs_Case_Study_PRINT_SAFE.html"
            >1. MovieMobs (Angular)</a
          >
        </li>
        <li>
          <a
            class="project-link"
            href="MEET_APP_CASE_STUDY.html"
            >2. Meet App (PWA)</a
          >
        </li>
        <li>
          <a
            class="project-link"
            href="RECIPE_APP_CASE_STUDY.html"
            >3. Recipe App (Python/Django)</a
          >
        </li>
        <li>
          <a
            class="project-link"
            href="CHAT_APP_CASE_STUDY.html"
            >4. Chat App (React Native)</a
          >
        </li>
      </ul>

      <div class="viewer-nav">
        <a href="https://ivancortesportfolio.vercel.app" class="nav-btn">Back to Main Portfolio</a>
      </div>
    </div>
  </body>
</html>
